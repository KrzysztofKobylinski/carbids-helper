<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bid.cars Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>bid.cars Helper</h1>
    <p class="counts">
      <span><strong id="hidden-count">0</strong> hidden</span>
      <span><strong id="opened-count">0</strong> opened</span>
    </p>
    <label class="toggle">
      <input type="checkbox" id="show-hidden" />
      Show hidden listings
    </label>
    <div class="actions">
      <button type="button" id="clear-hidden">Clear hidden</button>
      <button type="button" id="clear-opened">Clear opened</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
